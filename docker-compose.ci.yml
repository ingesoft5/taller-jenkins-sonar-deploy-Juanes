services:
  nexus:
    image: sonatype/nexus3:latest
    container_name: nexus
    ports:
      - "8081:8081"
    volumes:
      - nexus_data:/nexus-data
    restart: unless-stopped
    networks:
      - devops-network

  jenkins:
    build:
      context: ./jenkins
      dockerfile: Dockerfile
    image: jenkins-docker:lts
    container_name: jenkins
    user: root
    ports:
      - "8080:8080"
      - "50000:50000"
    volumes:
      - jenkins_home:/var/jenkins_home
      - /var/run/docker.sock:/var/run/docker.sock
    restart: unless-stopped
    networks:
      - devops-network

volumes:
  nexus_data:
  jenkins_home:

networks:
  devops-network:
    external: true
    name: taller-jenkins-sonar-deploy_devops-network